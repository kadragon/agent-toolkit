name: Harness CI

on:
  pull_request:
    branches: [main]

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      # The skill trigger fixture check compares against the PR base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Keep Ruff aligned with the local pre-commit gate.
      - name: Install Ruff and PyYAML
        run: python3 -m pip install --quiet 'ruff==0.16.0' pyyaml

      - name: Check script line endings
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-files", "--", "*.sh", "*.bash", "*.py"],
              text=True,
          ).splitlines()

          bad = []
          for raw_path in paths:
              try:
                  blob = subprocess.check_output(
                      ["git", "cat-file", "blob", f"HEAD:{raw_path}"]
                  )
              except (subprocess.CalledProcessError, OSError) as e:
                  print(f"WARNING: could not read blob {raw_path}: {e}", file=sys.stderr)
                  continue
              if b"\r" in blob:
                  bad.append(raw_path)

          if bad:
              print("ERROR: executable text files must use LF line endings:")
              for path in bad:
                  print(f"  {path}")
              print("Fix with .gitattributes and git add --renormalize.")
              sys.exit(1)

          print("OK: executable text files use LF line endings.")
          PY

      - name: Check JSON encoding
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-files", "--", "*.json"],
              text=True,
          ).splitlines()

          bad = [p for p in paths if open(p, "rb").read(3) == b"\xef\xbb\xbf"]

          if bad:
              print("ERROR: JSON files must be UTF-8 with no BOM — strict parsers reject the leading EF BB BF:")
              for path in bad:
                  print(f"  {path}")
              print("Cause: Windows PowerShell 5.1 Out-File/Set-Content -Encoding utf8 writes a BOM.")
              print("Fix: rewrite the file without the first 3 bytes (git bash, or an editor set to UTF-8 without BOM).")
              sys.exit(1)

          print(f"OK: {len(paths)} tracked JSON files are BOM-free.")
          PY

      - name: Test harness drift detection
        run: python3 scripts/ci/test_check_harness_drift.py

      - name: Check harness portability and references
        run: python3 scripts/ci/check_harness_drift.py

      - name: Test harness validation
        run: python3 dev/skills/harness-init/scripts/test_validate_harness.py

      - name: Test harness reconciliation
        run: python3 dev/skills/harness-init/scripts/test_reconcile_harness.py

      # `.python-version` and ruff.toml's `target-version` are two spellings of the
      # same floor, and NOTHING in the toolchain reconciles them: ruff never reads
      # `.python-version`, and setup-python only picks the interpreter that runs pip.
      # Left unchecked they drift silently — bumping one while the other stays put
      # goes unnoticed. Assert they agree so the doc's claim is actually enforced.
      - name: Check Python version alignment
        run: |
          floor="py$(tr -d '.[:space:]' < .python-version)"
          target=$(grep -E '^target-version' ruff.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$floor" != "$target" ]; then
            echo "ERROR: .python-version ($floor) != ruff.toml target-version ($target)."
            echo "Both record the repo's Python floor — bump them together."
            exit 1
          fi
          echo "OK: Python floor $floor agrees with ruff target-version."

      # Repo-wide, not just the hook's */scripts/*.py scope. The repo sits at 0
      # violations everywhere, and repo-wide is what mechanically enforces
      # ruff.toml's target-version: lowering it below py312 makes ruff's
      # version-aware parser report 6 E9 invalid-syntax errors on the PEP 701
      # f-strings in prod/skills/hwpx/scripts/table.py. Until this job existed
      # that floor was asserted in a comment alone.
      - name: Check Python code with Ruff
        run: ruff check --no-cache .

      - name: Test CI test-suite detection
        run: python3 scripts/ci/check_test_suites_wired.py --test

      - name: Check that all test suites are wired
        run: python3 scripts/ci/check_test_suites_wired.py

      - name: Test frontmatter validation
        run: python3 scripts/ci/test_check_skill_frontmatter.py

      - name: Check skill, agent, and command frontmatter
        run: python3 scripts/ci/check_skill_frontmatter.py

      - name: Test skill size validation
        run: python3 scripts/ci/check_skill_size.py --test

      - name: Check skill line limits
        run: python3 scripts/ci/check_skill_size.py

      - name: Test bundled asset validation
        run: python3 scripts/ci/test_check_asset_hygiene.py

      - name: Check bundled asset hygiene
        run: python3 scripts/ci/check_asset_hygiene.py

      - name: Test skill trigger ranking
        run: python3 scripts/ci/test_check_skill_triggers.py

      - name: Check skill trigger fixtures
        run: python3 scripts/ci/check_skill_triggers.py

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      # Version checks use the merge base with origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Test changelog validation
        run: python3 scripts/ci/test_check_changelog_entries.py

      - name: Check file-queue changelog entries
        run: python3 scripts/ci/check_changelog_entries.py

      - name: Test version bump script
        run: python3 scripts/ci/test_bump_version.py

      # Parser self-test only: the gate itself needs the `claude` CLI and stays local.
      - name: Test mods validation script
        run: python3 scripts/check_mods.py --test

      - name: Test skill version validation
        run: python3 scripts/ci/test_check_skill_version_bump.py

      - name: Check skill version bumps
        run: python3 scripts/ci/check_skill_version_bump.py

      - name: Check cross-platform plugin version bumps
        run: |
          ver_gt() {
            local IFS=.
            read -r a1 a2 a3 <<< "$1"
            read -r b1 b2 b3 <<< "$2"
            [ "$a1" -gt "$b1" ] && return 0
            [ "$a1" -lt "$b1" ] && return 1
            [ "$a2" -gt "$b2" ] && return 0
            [ "$a2" -lt "$b2" ] && return 1
            [ "$a3" -gt "$b3" ]
          }
          version='^[0-9]+\.[0-9]+\.[0-9]+$'
          for plugin in dev prod guard; do
            changed=$(git diff --name-only --no-renames origin/main...HEAD -- "$plugin/")
            if [ -z "$changed" ]; then
              echo "SKIP: $plugin/ not changed."
              continue
            fi
            claude="$plugin/.claude-plugin/plugin.json"
            codex="$plugin/.codex-plugin/plugin.json"
            new_claude=$(jq -er .version "$claude")
            new_codex=$(jq -er .version "$codex")
            if [[ ! "$new_claude" =~ $version || "$new_claude" != "$new_codex" ]]; then
              echo "ERROR: $plugin manifests must have the same SemVer ($new_claude vs $new_codex)."
              exit 1
            fi
            if ! git cat-file -e "origin/main:$claude" 2>/dev/null; then
              echo "OK: new $plugin plugin starts at $new_claude in both manifests."
              continue
            fi
            old_claude=$(git show "origin/main:$claude" | jq -er .version)
            old_codex=$(git show "origin/main:$codex" | jq -er .version)
            if ! ver_gt "$new_claude" "$old_claude" || ! ver_gt "$new_codex" "$old_codex"; then
              echo "ERROR: $plugin needs a strict SemVer increase in both manifests."
              exit 1
            fi
            echo "OK: $plugin version bumped to $new_claude in both manifests."
          done

      - name: Check mods plugin version bump
        run: |
          ver_gt() {
            local IFS=.
            read -r a1 a2 a3 <<< "$1"
            read -r b1 b2 b3 <<< "$2"
            [ "$a1" -gt "$b1" ] && return 0
            [ "$a1" -lt "$b1" ] && return 1
            [ "$a2" -gt "$b2" ] && return 0
            [ "$a2" -lt "$b2" ] && return 1
            [ "$a3" -gt "$b3" ]
          }
          CHANGED=$(git diff origin/main...HEAD -- mods/ | grep -c '^+\|^-' || true)
          if [ "$CHANGED" -gt 0 ]; then
            if ! git cat-file -e "origin/main:mods/.claude-plugin/plugin.json" 2>/dev/null; then
              echo "OK: mods/ is new or renamed on this branch (no manifest on origin/main) - skipping version-increment check."
              exit 0
            fi
            OLD_CLAUDE=$(git show origin/main:mods/.claude-plugin/plugin.json | jq -r .version)
            NEW_CLAUDE=$(jq -r .version mods/.claude-plugin/plugin.json)
            for v in OLD_CLAUDE NEW_CLAUDE; do
              eval "val=\$$v"
              [ "$val" = "null" ] && { echo "ERROR: mods $v version key missing in manifest."; exit 1; }
            done
            if ! ver_gt "$NEW_CLAUDE" "$OLD_CLAUDE"; then
              echo "ERROR: mods/ changed but version did not increase ($OLD_CLAUDE -> $NEW_CLAUDE). Bumps must be a strict SemVer increment."
              echo "See docs/conventions.md for semver rules."
              exit 1
            fi
            echo "OK: mods version bumped ($OLD_CLAUDE -> $NEW_CLAUDE)."
          else
            echo "SKIP: mods/ not changed."
          fi

  dev-tests:
    name: Dev regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Test transcript scanning
        run: python3 dev/skills/harness-curate/scripts/test_scan_transcripts.py

      - name: Test plugin contract checks
        run: python3 dev/skills/harness-curate/scripts/check_plugin_contracts.py --test

      - name: Test plugin disabling
        run: python3 dev/skills/harness-curate/scripts/disable_plugins.py --test

      - name: Test backlog candidate selection
        run: python3 dev/skills/task-next/scripts/backlog_candidates.py --test

      - name: Test queue backend selection
        run: python3 dev/skills/task-next/scripts/queue_backend.py --test

      - name: Test backlog migration
        run: python3 dev/skills/task-next/scripts/migrate_backlog.py --test

      - name: Test repository dispatch
        run: python3 dev/skills/dispatch/scripts/test_dispatch.py

      - name: Test dependency consolidation
        run: python3 dev/skills/repo-dependabot/scripts/consolidate-deps.py --selftest

      # Owns the branch-keyed contract/evidence archive both cycles resume from, and pins
      # review-cycle Step 1's clean-tree branch against skipping commit-guard on a resume.
      - name: Test task cycle state
        run: python3 dev/skills/task-next/scripts/test_cycle_state.py

      # Both task-next and task-new invoke this one copy; a break here breaks both cycles.
      - name: Test task graph operations
        run: python3 dev/skills/task-next/scripts/task_nodes.py --test

      - name: Test run recording
        run: python3 dev/skills/harness-curate/scripts/record_run.py --test

  prod-tests:
    name: Prod regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # hwpx and report-draft parse untrusted XML through defusedxml; without fsrs,
      # quiz_state.py --test SKIPs the FSRS scheduler path users with py-fsrs take.
      - name: Install defusedxml and fsrs
        run: python3 -m pip install --quiet defusedxml fsrs

      - name: Test HWPX shared utilities
        run: python3 prod/skills/hwpx/scripts/_common.py --test

      - name: Test HWPX document building
        run: python3 prod/skills/hwpx/scripts/build.py --test

      - name: Test HWPX office operations
        run: python3 prod/skills/hwpx/scripts/office.py --test

      - name: Test HWPX table operations
        run: python3 prod/skills/hwpx/scripts/table.py --test

      - name: Test HWPX text operations
        run: python3 prod/skills/hwpx/scripts/text.py --test

      - name: Test HWPX content comparison
        run: python3 prod/skills/hwpx/scripts/test_compare.py

      - name: Test HWPX validation
        run: python3 prod/skills/hwpx/scripts/validate.py --test

      - name: Test Korean style auditing
        run: python3 prod/skills/kr-style/scripts/kr_audit.py --test

      - name: Test quiz scheduling
        run: python3 prod/skills/repo-quiz/scripts/quiz_state.py --test

      - name: Test report linting
        run: python3 prod/skills/report-draft/scripts/lint_report.py --test

  review-tests:
    name: Review and merge regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Test commit guard self-checks
        run: python3 guard/hooks/commit-guard/guard.py --test

      - name: Test commit guard regressions
        run: python3 scripts/ci/test_commit_guard.py

      - name: Test memory guard
        run: python3 guard/hooks/memory-guard/guard.py --test

      - name: Test the standalone hook bundle
        run: python3 scripts/ci/test_guard_plugin.py

      - name: Test commit and push
        run: python3 dev/skills/task-review-cycle/scripts/test_commit_and_push.py

      - name: Test CI status polling
        run: python3 dev/skills/task-review-cycle/scripts/test_ci_wait.py

      - name: Test merge and cleanup
        run: python3 dev/skills/task-review-cycle/scripts/test_merge_and_cleanup.py

      - name: Test pre-merge synchronization
        run: python3 dev/skills/task-review-cycle/scripts/test_pre_merge_resync.py

      # Cache hits are asserted by counting hub.sh calls, so this needs no network and no gh.
      - name: Test review preflight
        run: python3 dev/skills/task-review-cycle/scripts/test_preflight.py

      # Covers both probe branches on a Linux runner: the platform selector is env-overridable, and
      # the Windows case stubs `tasklist` on PATH — which is what pins the `/NH` vs `//NH` flag form
      # whose failure silently disables the prune on MINGW.
      - name: Test Codex reviewer launcher
        run: python3 dev/skills/task-review-cycle/scripts/test_codex_review.py

      # Guards the Sprint Contract argument against shell injection, and the prompt
      # assembly against the bash 3.2 heredoc trap that CI's bash 5 cannot reproduce.
      - name: Test Claude reviewer launcher
        run: python3 dev/skills/task-review-cycle/scripts/test_claude_review.py

      # Pins the read-only prompt scope and the late-reclaim sidecar (pending → review + meta).
      - name: Test AGY reviewer launcher
        run: python3 dev/skills/task-review-cycle/scripts/test_agy_review.py
